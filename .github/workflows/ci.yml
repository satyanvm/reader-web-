name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build and launch check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Reports remaining placeholders in the job log without failing the build.
      - run: npm run check:launch -- --warn
